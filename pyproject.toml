[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barograph"
version = "0.1.0"
description = "Weather forecast modeling, post-processing and verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Barograph Contributors" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "dask[complete]>=2023.7",
    "zarr>=2.15",
    "cfgrib>=0.9",
    "eccodes>=1.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "toml>=0.10",
    "loguru>=0.7",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "mypy>=1.5",
    "ruff>=0.0.280",
    "pre-commit>=3.3",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]

[project.scripts]
barograph = "barograph.cli.main:cli"

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs docs/_build/html"
clean = "rm -rf docs/_build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N803/N806/N812: uppercase X/Z feature matrices and aliasing are idiomatic
# in scientific ML code; E501 is relaxed below.
ignore = ["N803", "N806", "N812"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party scientific libraries do not ship type stubs.
module = [
    "yaml",
    "scipy",
    "scipy.interpolate",
    "scipy.ndimage",
    "scipy.special",
    "sklearn.model_selection",
    "sklearn.linear_model",
    "sklearn.ensemble",
    "cfgrib",
    "eccodes",
    "cdsapi",
    "zarr",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
